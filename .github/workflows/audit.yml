name: Product audit evidence
on:
  push:
    branches: ['audit/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://audit.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: public-audit-placeholder
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: mkdir -p audit-artifacts && git rev-parse HEAD > audit-artifacts/revision.txt
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: set -o pipefail; pnpm typecheck 2>&1 | tee audit-artifacts/typecheck.log
      - name: Tests
        run: set -o pipefail; pnpm test 2>&1 | tee audit-artifacts/tests.log
      - name: Python tests
        run: set -o pipefail; python3 -m unittest discover -s local-tools -p 'test_*.py' 2>&1 | tee audit-artifacts/python.log
      - name: Build
        run: set -o pipefail; pnpm build 2>&1 | tee audit-artifacts/build.log
      - name: Dependency security gate
        run: pnpm audit --json > audit-artifacts/dependency-audit.json
      - name: Media and browser tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          npm install --prefix /tmp/studio-audit-browser --no-save playwright@1.56.1
          /tmp/studio-audit-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real renderer and ducking regression (synthetic media only)
        run: |
          set -o pipefail
          pnpm --filter @studio/worker smoke:render 2>&1 | tee audit-artifacts/render.log
          pnpm --filter @studio/worker exec tsx src/render-audio.smoke.ts 2>&1 | tee audit-artifacts/audio.log
          cp apps/worker/tmp/render-smoke/smoke-output.mp4 audit-artifacts/renderer-fixture.mp4
          cp apps/worker/tmp/render-smoke/smoke-thumbnail.jpg audit-artifacts/renderer-thumbnail.jpg
          ffmpeg -hide_banner -loglevel error -i audit-artifacts/renderer-fixture.mp4 -frames:v 1 -pix_fmt gray -f rawvideo /tmp/first-frame.gray
          python3 - <<'PY'
          from pathlib import Path
          import json
          frame=Path('/tmp/first-frame.gray').read_bytes()
          mean=sum(frame)/len(frame)
          assert mean>20, 'Synthetic opening frame must not fade from black'
          Path('audit-artifacts/first-frame.json').write_text(json.dumps({'fixtureMeanLuma':mean,'passed':True}))
          PY
      - name: Browser regression and live read-only observations
        env:
          AUDIT_LIVE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          pnpm --filter @studio/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          import {writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const require=createRequire('/tmp/studio-audit-browser/package.json');
          const {chromium}=require('playwright');
          const browser=await chromium.launch();
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const result={scope:'Logged-out UI only; synthetic auth config; no authenticated AI generation',checks:[],observations:[],errors:[]};
          page.on('pageerror',e=>result.errors.push(String(e)));
          const base='http://127.0.0.1:4173/ai-short-video-studio/';
          try {
            for(let i=0;i<30;i++){try{if((await fetch(base)).ok)break;}catch{}await new Promise(r=>setTimeout(r,500));}
            await page.goto(base,{waitUntil:'networkidle'});
            const email=page.locator('input[type=email]');await email.waitFor();
            const box=await email.boundingBox();
            assert(box && box.y>=0 && box.y+box.height<844);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
            result.checks.push({name:'mobile-form-above-fold',passed:true,emailBox:box});
            await page.screenshot({path:'audit-artifacts/patched-mobile.png',fullPage:true});
            await email.fill('bad-address');assert.equal(await email.evaluate(el=>el.validity.valid),false);
            result.checks.push({name:'invalid-email-validation',passed:true});
            await page.reload({waitUntil:'networkidle'});await page.locator('input[type=password]').waitFor();
            result.checks.push({name:'refresh-login',passed:true});
            await page.goto(base+'new',{waitUntil:'networkidle'});await page.locator('input[type=password]').waitFor();
            assert(page.url().endsWith('/login'));result.checks.push({name:'protected-route',passed:true});
            await page.setViewportSize({width:1440,height:1000});await page.goto(base,{waitUntil:'networkidle'});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
            await page.screenshot({path:'audit-artifacts/patched-desktop.png',fullPage:true});
            assert.equal(result.errors.length,0);result.checks.push({name:'no-page-exceptions',passed:true});
            if(process.env.AUDIT_LIVE_API_URL){
              const api=process.env.AUDIT_LIVE_API_URL.replace(/\/$/,'');
              for(const [path,expected] of [['/health',200],['/v1/projects',401]]){
                try{const r=await fetch(api+path,{signal:AbortSignal.timeout(15000)});result.observations.push({name:'live-api'+path,status:r.status,expected,passed:r.status===expected});}
                catch(e){result.observations.push({name:'live-api'+path,status:'NOT_TESTED',error:String(e)});}
              }
            }
          }catch(e){result.errors.push(String(e));process.exitCode=1;}
          finally{await writeFile('audit-artifacts/browser.json',JSON.stringify(result,null,2));await browser.close();}
          console.log(JSON.stringify(result,null,2));
          JS
      - name: Record source
        if: always()
        run: git archive --format=tar HEAD -o audit-artifacts/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-regression-${{ github.sha }}
          path: audit-artifacts/
          retention-days: 14
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-audit-only
          POSTGRES_DB: studio_audit
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-audit-only
      PGDATABASE: studio_audit
    steps:
      - uses: actions/checkout@v6
      - name: Reproduce baseline and verify permissions and existing SQL regressions
        run: |
          mkdir -p audit-artifacts
          set -o pipefail
          {
            psql -v ON_ERROR_STOP=1 -f scripts/audit/db-bootstrap.sql
            for path in supabase/migrations/20261002*.sql supabase/migrations/20261004*.sql; do psql -v ON_ERROR_STOP=1 -f "$path"; done
            psql -v ON_ERROR_STOP=1 -f scripts/audit/db-baseline.sql
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261005090000_api_only_project_writes.sql
            psql -v ON_ERROR_STOP=1 -f supabase/tests/access_regressions.sql
            psql -v ON_ERROR_STOP=1 -f supabase/tests/pipeline_regressions.sql
          } 2>&1 | tee audit-artifacts/database.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-database-${{ github.sha }}
          path: audit-artifacts/
          retention-days: 14
