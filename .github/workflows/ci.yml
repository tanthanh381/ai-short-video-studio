name: Kiem tra ma nguon

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Kiem tra khong lo secret trong bundle
        run: |
          if grep -R -E "(sk-[A-Za-z0-9_-]{20,}|sb_secret_)" apps/web/dist; then
            echo "Phat hien chuoi giong secret trong frontend bundle"
            exit 1
          fi
